  <title id="titulo">Flujo de Copiloto PO</title>
  <desc id="desc">Seis etapas: levantar con el cliente, acordar alcance y precio, ordenar qué va primero, construir en sprints, entregar y cobrar, y aprender; los cambios y aprendizajes vuelven al backlog.</desc>
  <rect width="1200" height="520" rx="18" fill="#f5f7fa"/>
  <text x="34" y="58" font-size="28" font-weight="800" fill="#10213a">Copiloto <tspan fill="#b8642e">PO</tspan></text>
  <text x="34" y="84" font-size="15" fill="#5a6b82">Del primer audio desordenado del cliente a la entrega aceptada, sin cuentas ni servidor.</text>
