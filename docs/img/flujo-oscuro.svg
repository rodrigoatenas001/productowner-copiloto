  <title id="titulo">Flujo de Copiloto PO</title>
  <desc id="desc">Seis etapas: levantar con el cliente, acordar alcance y precio, ordenar qué va primero, construir en sprints, entregar y cobrar, y aprender; los cambios y aprendizajes vuelven al backlog.</desc>
  <rect width="1200" height="520" rx="18" fill="#0d1117"/>
  <text x="34" y="58" font-size="28" font-weight="800" fill="#e6edf3">Copiloto <tspan fill="#d9884f">PO</tspan></text>
  <text x="34" y="84" font-size="15" fill="#9fb0c8">Del primer audio desordenado del cliente a la entrega aceptada, sin cuentas ni servidor.</text>
